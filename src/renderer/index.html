<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartShell</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #0f1117;
      }

      .boot-splash {
        display: grid;
        width: 100vw;
        height: 100vh;
        place-items: center;
        color: #d6deeb;
        font-family: Inter, Segoe UI, system-ui, sans-serif;
        background:
          radial-gradient(circle at 50% 35%, rgb(93 228 199 / 10%), transparent 28%),
          #0f1117;
      }

      .boot-card {
        display: grid;
        justify-items: center;
        gap: 10px;
      }

      .boot-card p {
        margin: 0;
        color: #7f8ca8;
      }

      .boot-mark {
        display: grid;
        width: 46px;
        height: 46px;
        place-items: center;
        border-radius: 14px;
        background: linear-gradient(135deg, #5de4c7, #82aaff);
        color: #07111f;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-splash">
        <div class="boot-card">
          <span class="boot-mark">S</span>
          <strong>SmartShell</strong>
          <p>Loading workspace...</p>
        </div>
      </main>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
