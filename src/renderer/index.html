<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartShell</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #0f1117;
      }

      .boot-splash {
        display: grid;
        width: 100vw;
        height: 100vh;
        place-items: center;
        color: #d6deeb;
        font-family: Inter, Segoe UI, system-ui, sans-serif;
        background:
          radial-gradient(circle at 50% 35%, rgb(93 228 199 / 10%), transparent 28%),
          #0f1117;
      }

      .boot-card {
        display: grid;
        justify-items: center;
        gap: 14px;
      }

      .boot-card p {
        margin: 0;
        color: #7f8ca8;
        font-size: 13px;
      }

      .boot-mark {
        display: grid;
        width: 56px;
        height: 56px;
        place-items: center;
        border-radius: 16px;
        background: linear-gradient(135deg, #5de4c7, #82aaff);
        color: #07111f;
        font-weight: 800;
        font-size: 24px;
        animation: boot-pulse 1.6s ease-in-out infinite;
        box-shadow: 0 0 30px rgb(93 228 199 / 25%);
      }

      .boot-title {
        animation: boot-fade-in 0.5s ease-out 0.3s both;
      }

      .boot-subtitle {
        animation: boot-fade-in 0.5s ease-out 0.5s both;
      }

      .boot-bar-track {
        width: 120px;
        height: 3px;
        border-radius: 2px;
        background: #23283a;
        overflow: hidden;
        animation: boot-fade-in 0.4s ease-out 0.6s both;
      }

      .boot-bar-fill {
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #5de4c7, #82aaff);
        animation: boot-slide 1.2s ease-in-out infinite;
      }

      @keyframes boot-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.06); opacity: 0.85; }
      }

      @keyframes boot-fade-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(200%); }
        100% { transform: translateX(-100%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-splash">
        <div class="boot-card">
          <span class="boot-mark">S</span>
          <strong class="boot-title">SmartShell</strong>
          <p class="boot-subtitle">Loading workspace...</p>
          <div class="boot-bar-track"><div class="boot-bar-fill"></div></div>
        </div>
      </main>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
